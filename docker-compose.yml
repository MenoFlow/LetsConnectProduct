# Démarrer PostgreSQL et pgAdmin avec une seule commande : docker compose up -d.
# Arrêter les services avec docker compose down ; effacer aussi les données avec docker compose down -v.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: materialconnect
      POSTGRES_USER: materialconnect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-materialconnect}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U materialconnect -d materialconnect"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@materialconnect.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
